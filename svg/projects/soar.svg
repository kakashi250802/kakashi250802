.4000000000000004s" repeatCount="indefinite" path="M700 190 L815 270 L930 190 L1045 270 L1140 190"/></circle><circle r="5" fill="#60a5fa"><animateMotion dur="4s" begin="3.2s" repeatCount="indefinite" path="M700 190 L815 270 L930 190 L1045 270 L1140 190"/></circle><circle r="11" fill="#60a5fa" opacity=".25"><animateMotion dur="4s" begin="3.2s" repeatCount="indefinite" path="M700 190 L815 270 L930 190 L1045 270 L1140 190"/></circle><g class="float" style="animation-delay:0.0s"><rect x="662" y="170" width="76" height="40" rx="12" fill="#0a1029" stroke="#22d3ee" stroke-width="2"/><rect x="662" y="170" width="76" height="40" rx="12" fill="#22d3ee" opacity=".12"/><text x="700" y="195" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="middle">TSX</text></g><g class="float" style="animation-delay:0.4s"><rect x="759" y="250" width="112" height="40" rx="12" fill="#0a1029" stroke="#8b5cf6" stroke-width="2"/><rect x="759" y="250" width="112" height="40" rx="12" fill="#8b5cf6" opacity=".12"/><text x="815" y="275" font-size="14" font-weight="700" fill="#8b5cf6" text-anchor="middle">Bytecode VM</text></g><g class="float" style="animation-delay:0.8s"><rect x="892" y="170" width="76" height="40" rx="12" fill="#0a1029" stroke="#60a5fa" stroke-width="2"/><rect x="892" y="170" width="76" height="40" rx="12" fill="#60a5fa" opacity=".12"/><text x="930" y="195" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle">Layout</text></g><g class="float" style="animation-delay:1.2000000000000002s"><rect x="1001" y="250" width="89" height="40" rx="12" fill="#0a1029" stroke="#ec4899" stroke-width="2"/><rect x="1001" y="250" width="89" height="40" rx="12" fill="#ec4899" opacity=".12"/><text x="1045" y="275" font-size="14" font-weight="700" fill="#ec4899" text-anchor="middle">Renderer</text></g><g class="float" style="animation-delay:1.6s"><rect x="1102" y="170" width="76" height="40" rx="12" fill="#0a1029" stroke="#fb923c" stroke-width="2"/><rect x="1102" y="170" width="76" height="40" rx="12" fill="#fb923c" opacity=".12"/><text x="1140" y="195" font-size="14" font-weight="700" fill="#fb923c" text-anchor="middle">GPU</text></g><text x="920" y="340" font-size="13" fill="#64748b" text-anchor="middle">from TSX to pixels, all drawn by Soar</text><defs><linearGradient id="sbbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect x="1.5" y="1.5" width="1197" height="377" rx="24" fill="none" stroke="url(#sbbl)" stroke-width="3" pathLength="1000" stroke-dasharray="200 800" stroke-linecap="round" style="animation:dash 7s linear infinite"/></g><rect x="1" y="1" width="1198" height="378" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/></svg>