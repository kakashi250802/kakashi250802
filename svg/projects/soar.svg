r="0.7" class="tw" style="animation-delay:0.69s;animation-duration:4.46s"/><circle cx="1106" cy="306" r="0.7" class="tw" style="animation-delay:1.95s;animation-duration:3.88s"/><circle cx="480" cy="287" r="1" class="tw" style="animation-delay:1.07s;animation-duration:3.77s"/><circle cx="508" cy="180" r="0.7" class="tw" style="animation-delay:3.43s;animation-duration:4.42s"/><circle cx="55" cy="19" r="1.6" class="tw" style="animation-delay:3.90s;animation-duration:4.62s"/><text x="40" y="62" font-size="30" font-weight="800" fill="#e2e8f0">Things I’m building</text><line x1="40" y1="84" x2="1160" y2="84" stroke="#fff" stroke-opacity=".08"/><rect x="60" y="108" width="200" height="28" rx="14" fill="#f59e0b" fill-opacity=".15" stroke="#f59e0b" stroke-opacity=".6"/><text x="160" y="127" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="1">FEATURED · IN PROGRESS</text><text x="60" y="184" font-size="48" font-weight="800" fill="url(#title)">Soar</text><text x="190" y="182" font-size="18" font-style="italic" fill="#94a3b8">Why flutter when you can soar?</text><text x="60" y="214" font-size="17" fill="#cbd5e1">A mobile UI engine with a Rust core. It draws every pixel itself</text><text x="60" y="240" font-size="17" fill="#cbd5e1">on the GPU, runs app logic written in TSX on a verified bytecode</text><text x="60" y="266" font-size="17" fill="#cbd5e1">VM, and ships updates over the air as data.</text><rect x="60" y="310" width="53" height="26" rx="13" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-opacity=".55"/><text x="87" y="327.5" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle">Rust</text><rect x="121.12" y="310" width="53" height="26" rx="13" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-opacity=".55"/><text x="148" y="327.5" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle">wgpu</text><rect x="182.24" y="310" width="60" height="26" rx="13" fill="#fb923c" fill-opacity=".14" s