# Redraws the live stats cards in the profile README once a day and
# commits them to svg/live/.
name: Profile images

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Draw stats cards
        run: python3 scripts/profile_art.py stats svg/live

      - name: Commit the new cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add svg/live
          git diff --cached --quiet || git commit -m "Update profile stats [skip ci]"
          git push
